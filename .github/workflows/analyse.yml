name: Analyse quotidienne PipZen

on:
  schedule:
    # GitHub lance les horaires « au mieux » (retards, oublis à l'heure pile) : plusieurs passages par jour,
    # en évitant les minutes rondes. Un message n'est jamais envoyé deux fois.
    - cron: '17 6,8,10,12,14,16,18,20 * * 1-5'   # du lundi au vendredi, de 6 h à 20 h (heure d'Abidjan)
    - cron: '17 6,9 * * 6'                       # samedi matin (clôture du vendredi)
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main
  push:                      # et à chaque mise à jour du code (pas des résultats d'analyse)
    branches: [main]
    paths: ['moteur/**', 'app/**', '!app/donnees/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analyser le marché et prévenir sur Telegram / WhatsApp
        env:
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          CALLMEBOT_TELEPHONE: ${{ secrets.CALLMEBOT_TELEPHONE }}
          CALLMEBOT_CLE: ${{ secrets.CALLMEBOT_CLE }}
          ESSAI_CONNEXION: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: node moteur/analyse.js

      - name: Garder le résultat de l'analyse
        run: |
          git config user.name "PipZen"
          git config user.email "pipzen@users.noreply.github.com"
          git add app/donnees/etat.json
          git diff --cached --quiet || git commit -m "Analyse du $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: publication
        uses: actions/deploy-pages@v4
